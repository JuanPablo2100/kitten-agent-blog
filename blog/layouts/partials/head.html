<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>
  {{- if .IsHome -}}
    {{ .Site.Title }}{{ with .Site.Params.tagline }} — {{ . }}{{ end }}
  {{- else -}}
    {{ .Title }} · {{ .Site.Title }}
  {{- end -}}
</title>

<meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}" />
<meta name="author" content="{{ .Site.Params.author }}" />
<link rel="canonical" href="{{ .Permalink }}" />

<meta property="og:site_name" content="{{ .Site.Title }}" />
<meta property="og:title" content="{{ .Title }}" />
<meta property="og:description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}" />
<meta property="og:type" content="{{ if .IsPage }}article{{ else }}website{{ end }}" />
<meta property="og:url" content="{{ .Permalink }}" />
{{ with .Params.image }}<meta property="og:image" content="{{ . | absURL }}" />{{ end }}

<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="{{ .Title }}" />
<meta name="twitter:description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}" />
{{ with .Params.image }}<meta name="twitter:image" content="{{ . | absURL }}" />{{ end }}

{{ range .AlternativeOutputFormats -}}
<link rel="{{ .Rel }}" type="{{ .MediaType.Type }}" href="{{ .Permalink }}" title="{{ $.Site.Title }}" />
{{ end -}}

<!-- Tailwind CSS via CDN — no build step required -->
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          'space-dark':   '#0d0d1a',
          'space-card':   '#1a1a35',
          'space-cyan':   '#00e5ff',
          'space-purple': '#9c27b0',
        },
        fontFamily: {
          sans: ['Segoe UI', 'system-ui', 'sans-serif'],
          mono: ['Cascadia Code', 'Fira Code', 'monospace'],
        }
      }
    }
  }
</script>

<style>
  body { background: #0d0d1a; }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      radial-gradient(1px 1px at 10% 20%, rgba(255,255,255,.5) 0%, transparent 100%),
      radial-gradient(1px 1px at 40% 60%, rgba(255,255,255,.3) 0%, transparent 100%),
      radial-gradient(1px 1px at 65% 10%, rgba(255,255,255,.6) 0%, transparent 100%),
      radial-gradient(1px 1px at 85% 80%, rgba(255,255,255,.4) 0%, transparent 100%),
      radial-gradient(1px 1px at 25% 85%, rgba(255,255,255,.3) 0%, transparent 100%),
      radial-gradient(1px 1px at 55% 45%, rgba(255,255,255,.2) 0%, transparent 100%);
    pointer-events: none;
    z-index: 0;
  }

  body::after {
    content: '';
    position: fixed;
    top: -20%;
    right: -10%;
    width: 70vw;
    height: 70vh;
    background: radial-gradient(ellipse, rgba(57,0,120,.3) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  .prose            { color: #e8e8f0; }
  .prose h1,
  .prose h2,
  .prose h3,
  .prose h4         { color: #fff; margin-top: 1.75em; }
  .prose a          { color: #00e5ff; text-decoration: underline; text-underline-offset: 3px; }
  .prose a:hover    { color: #67e8f9; }
  .prose strong     { color: #fff; }
  .prose code       { background: rgba(0,0,0,.4); color: #00e5ff;
                      padding: .1em .4em; border-radius: .3em; font-size: .875em; }
  .prose pre        { background: rgba(0,0,0,.5); border: 1px solid rgba(0,229,255,.15);
                      border-radius: .5rem; padding: 1rem; overflow-x: auto; }
  .prose pre code   { background: none; padding: 0; }
  .prose blockquote { border-left: 3px solid #9c27b0; padding-left: 1rem;
                      color: #888ab0; font-style: italic; margin: 1.5em 0; }
  .prose ul li::marker,
  .prose ol li::marker { color: #00e5ff; }
  .prose hr         { border-color: rgba(255,255,255,.1); }
  .prose img        { border-radius: .5rem; border: 1px solid rgba(255,255,255,.1); }
  .prose table      { width: 100%; }
  .prose th         { background: rgba(0,229,255,.08); color: #fff; }
  .prose td,
  .prose th         { border: 1px solid rgba(255,255,255,.08); padding: .5rem .75rem; }
</style>
